apiVersion: mogenius.com/v1alpha1
kind: PlatformDefault
spec:
  # renovate: datasource=helm registryUrl=https://grafana-community.github.io/helm-charts chart=loki
  #
  # The chart moved: grafana.github.io/helm-charts froze at 7.3.0 (2026-08),
  # the community fork at grafana-community.github.io continues it with its
  # own numbering in the 18.x line. The operator's default repository already
  # points at the fork, so a 7.x pin here resolves against an index where it
  # does not exist and Loki cannot install at all -- version and registryUrl
  # must name the same repository.
  version: 18.12.1
  valuesObject:
    # The chart renders nothing without a storage decision -- it fails on
    # "Please define loki.storage.bucketNames.chunks" -- so an empty
    # valuesObject made Loki uninstallable whatever the version said.
    #
    # This is the smallest configuration that stands up: one pod, logs on a
    # local volume, no object storage and no caches. Enough for a cluster to
    # collect its own logs, and deliberately not a production topology -- for
    # that, point loki.storage at a bucket and move off SingleBinary. Both are
    # overridable per cluster through spec.loki.patches.
    # 18.x renames the mode; "SingleBinary" is the deprecated alias.
    deploymentMode: Monolithic
    loki:
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
    singleBinary:
      replicas: 1
    # The scalable topology's components, off: SingleBinary replaces them, and
    # left at their defaults they would be scheduled alongside it.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    # Memcached deployments the scalable topology brings. A single binary on a
    # filesystem has nothing to cache across.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # Test and canary workloads. Useful when validating the chart itself, noise
    # in a platform install.
    lokiCanary:
      enabled: false
    test:
      enabled: false
