apiVersion: mogenius.com/v1alpha1
kind: PlatformDefault
spec:
  # renovate: datasource=helm registryUrl=https://helm.mogenius.com/public chart=mogenius-agent-sandbox
  #
  # The mogenius chart that brings up the whole agent-sandbox system: the
  # kubernetes-sigs/agent-sandbox controller with extensions, a locked-down
  # sandbox namespace, the default SandboxTemplate + warm pool, and a per-sandbox
  # NetworkPolicy. The operator installs it as the `agentSandboxes` PlatformConfig
  # component; the chart's own defaults already stand a cluster up, so this file
  # mostly pins the version.
  version: 1.2.1
  valuesObject:
    sandboxes:
      namespace:
        # Where sandbox pods run. spec.agentSandboxes.namespace overrides it.
        name: agent-sandbox
      networkPolicy:
        # The platform stance for untrusted agent code: the controller manages a
        # per-sandbox NetworkPolicy whose default rule set allows internet egress
        # but denies RFC1918 and link-local — the latter covering the
        # 169.254.169.254 metadata endpoint (the classic SSRF/exfil vector).
        # The kube-apiserver CIDR is cluster-specific, so it is not blocked here
        # by default: set it per cluster via
        # spec.agentSandboxes.networkPolicy.additionalBlockedCidrs.
        managed: true
