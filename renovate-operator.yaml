apiVersion: mogenius.com/v1alpha1
kind: PlatformDefault
spec:
  # renovate: datasource=docker packageName=ghcr.io/mogenius/helm-charts/renovate-operator
  version: 5.6.0
  valuesObject:
    crd:
      mode: template
    fullnameOverride: renovate-operator

    config:
      jobTTLSecondsAfterFinished: 3600
      deleteSuccessfulJobs: true
      logStorage:
        mode: memory

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 128Mi
