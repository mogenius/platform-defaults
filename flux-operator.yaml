apiVersion: mogenius.com/v1alpha1
kind: PlatformDefault
spec:
  # The chart is published to an OCI registry, so this is a docker/packageName
  # pin rather than the helm/registryUrl form the other files use.
  #
  # It used to read `registryUrl=https://controlplane.github.io/charts`, which
  # answers 404 -- so Renovate could not resolve the chart and never proposed a
  # bump. The version sat where it was put, and nothing said so.
  # renovate: datasource=docker packageName=ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  version: 0.59.0
  valuesObject: {}
